[project]
name = "pygatebox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.0.0",
    "pyqt6>=6.10.1",
    "pyserial>=3.5",
    "rich>=14.2.0",
]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["D100", "D104"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = false

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ub.build-backend]
package-dir = "src"

[project.scripts]
app = "pygatebox.app.app_main:main"